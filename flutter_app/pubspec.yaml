name: sports_stream
description: Sports Stream Platform — mobile client for the Django backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.1

  # State management
  flutter_riverpod: ^2.5.1

  # Date/time formatting with locale support
  intl: ^0.19.0

  # Open platform URLs (DAZN, Movistar+…)
  url_launcher: ^6.3.0

  # Pull-to-refresh indicator
  # (included in Flutter's Material by default — no extra package needed)

  # App icon and splash
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
